<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>

    <form action="cadastro.php"  method="get" autocomplete="on">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="isxmas" checked><label for="isxmas"  >Masculino</label>
            <input type="radio" name="sexo" id="sxfem"><label for="sxfem">Feminino</label>
        </fieldset>




        <fieldset>
            <legend>Esportes favoritos</legend>
            
            <input type="checkbox" name="esfut" id="iesfut"><label for="iesfut">Futebol</label> <br>
           
            
           <input type="checkbox" name="esbas" id="iesbas"><label for="iesbas">Basquete</label> <br>


           
                <input type="checkbox"
                name="esvolei" id="iesvolei"><label for="iesvolei">Vôlei</label> <br>


           

           
            <input type="checkbox" name="esf1" id="iesf1"><label for="iesf1">Fórmula 1</label><br>

             <input type="checkbox" name="esnat" id="iesnat"><label for="iesnat">Natação</label> <br>

             <input type="checkbox" name="esten" id="iesten"><label for="iesten">Tênis</label>
            <br>

            <label for="ioutros">Outros? Quais?</label>
            <input type="text" name="outros" id="ioutros">



        </fieldset>
        
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>



    </form>
</body>
</html>
